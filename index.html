  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Order summary card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <img src="images/illustration-hero.svg" alt="Illustration of a person listening to music" class="card-image">
    
    <div class="card-content">
      <h1 class="card-title">Order Summary</h1>
      <p class="card-description">
        You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!
      </p>

      <div class="plan-box">
        <img src="images/icon-music.svg" alt="Music icon" class="plan-icon">
        <div class="plan-details">
          <h2 class="plan-title">Annual Plan</h2>
          <p class="plan-price">$59.99/year</p>
        </div>
        <a href="#" class="plan-change">Change</a>
      </div>

      <button class="btn-primary">Proceed to Payment</button>
      <a href="#" class="btn-secondary">Cancel Order</a>
    </div>
  </main>

</body>
</html>
